name: Launcher (Windows)

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version déjà publiée ?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q '^latest.yml$'; then echo "publier=non" >> "$GITHUB_OUTPUT"; else echo "publier=oui" >> "$GITHUB_OUTPUT"; fi
      - name: Construire l'installateur Windows
        run: npx electron-builder --win --publish never
      - name: Publier la version (installateur + fichiers de mise à jour automatique)
        if: steps.version.outputs.publier == 'oui'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OnyxFight Launcher $V" --notes "Télécharge **OnyxFight-Launcher.exe** et double-clique dessus : le launcher s’ouvre directement. Les launchers déjà installés se mettent à jour tout seuls."
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxFight-Launcher-Setup
          path: dist/*.exe
