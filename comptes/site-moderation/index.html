<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace équipe · OnyxFight</title>
<link rel="icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="mod.css">
<script src="mod.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="connexion cache" id="ecran-connexion">
  <form id="form-connexion">
    <div class="logo"><img src="icone.png" alt="">OnyxFight</div>
    <p>Espace réservé à l'équipe. Connecte-toi avec ton compte OnyxFight.</p>
    <label for="c-pseudo">Pseudo</label>
    <input id="c-pseudo" autocomplete="username" maxlength="16" required>
    <label for="c-mdp">Mot de passe</label>
    <input id="c-mdp" type="password" autocomplete="current-password" required>
    <button class="bouton" id="c-valider" style="width:100%;margin-top:18px">Se connecter</button>
    <div class="message" id="c-msg"></div>
  </form>
</div>
<div class="appli cache" id="appli">
  <aside class="cote">
    <div class="marque"><img src="icone.png" alt=""><div>OnyxFight<small>Espace équipe</small></div></div>
    <nav id="menu"></nav>
    <div class="pied">OnyxFight · modération</div>
  </aside>
  <section class="principal">
    <header class="haut">
      <h1 id="titre">Accueil</h1>
      <div class="recherche"><input id="recherche" placeholder="Rechercher un joueur (pseudo, UUID, n°)…" autocomplete="off"><div class="suggestions cache" id="suggestions"></div></div>
      <div class="qui" id="qui"></div>
    </header>
    <div class="contenu" id="vue"></div>
  </section>
</div>
</body>
</html>
