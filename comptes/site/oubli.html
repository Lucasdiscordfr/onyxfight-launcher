<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mot de passe oublié · OnyxFight</title>
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="commun.js" defer></script>
</head>
<body>
<header>
  <a class="marque" href="/"><img src="icone.png" alt="">OnyxFight</a>
  <nav id="menu"></nav>
</header>
<main>
  <form class="carte formulaire" id="form">
    <h1>Mot de passe oublié</h1>
    <p class="sous">Avec ton e-mail et la réponse à ta question secrète, tu choisis un nouveau mot de passe.</p>
    <label for="pseudo">Pseudo</label>
    <input id="pseudo" autocomplete="username" maxlength="16" required>
    <label for="email">Adresse e-mail du compte</label>
    <input id="email" type="email" maxlength="200" required>
    <div id="etape2" class="cache">
      <label for="reponse" id="q">Question secrète</label>
      <input id="reponse" maxlength="64" autocomplete="off">
      <label for="nouveau">Nouveau mot de passe</label>
      <input id="nouveau" type="password" autocomplete="new-password" minlength="8">
    </div>
    <button class="bouton" id="valider">Continuer</button>
    <div class="message" id="msg"></div>
    <p class="bas">Sans e-mail ni question secrète enregistrés, viens sur le <a href="https://discord.gg/onyxfight" target="_blank" rel="noopener">Discord</a>.</p>
  </form>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let etape = 1;
  $('form').onsubmit = async (e) => {
    e.preventDefault();
    $('valider').disabled = true;
    if (etape === 1) {
      const r = await api('question', { pseudo: $('pseudo').value.trim() });
      $('valider').disabled = false;
      if (r.erreur) return message($('msg'), r.erreur);
      $('q').textContent = r.question;
      $('etape2').classList.remove('cache');
      $('reponse').required = $('nouveau').required = true;
      $('valider').textContent = 'Changer le mot de passe';
      etape = 2;
      return;
    }
    const r = await api('recuperer', { pseudo: $('pseudo').value.trim(), email: $('email').value.trim(), reponse: $('reponse').value, nouveau: $('nouveau').value });
    $('valider').disabled = false;
    if (r.erreur) return message($('msg'), r.erreur);
    Session.ecrire(r.session);
    location.href = '/compte';
  };
});
</script>
<footer>OnyxFight · serveur PvP Faction moddé · Pas affilié à Mojang ni Microsoft.</footer>
</body>
</html>
