<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modération · OnyxFight</title>
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="commun.js" defer></script>
</head>
<body>
<header>
  <a class="marque" href="/"><img src="icone.png" alt="">OnyxFight</a>
  <nav id="menu"></nav>
</header>
<main>
  <h1 class="titre-page">Modération</h1>
  <p class="sous-titre" id="qui">Chargement…</p>
  <div class="panneau cache" id="panneau">
    <div class="cote" id="cote"></div>
    <div id="zone"></div>
  </div>
</main>
<script>
let moi = null, ongletActif = null, minuterie = null, seqConsole = 0;
const S = () => Session.lire();
const SECTIONS = [
  ['tableau', '📊 Tableau de bord', 1], ['joueurs', '👤 Joueurs & casier', 1], ['console', '🖥 Console', 2],
  ['evenements', '⚡ Événements & annonces', 2], ['factions', '⚑ Factions', 2], ['economie', '💰 Argent & cadeaux', 3],
  ['equipe', '🛡 Équipe', 3], ['journal', '📜 Journal', 2], ['reglages', '⚙ Réglages du site', 3],
];
const NOMS_SANCTIONS = { ban: 'Bannissement', mute: 'Mute', warn: 'Avertissement', kick: 'Expulsion' };

function dateHeure(t) { return t ? new Date(t).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—'; }
function carte(titre, ...contenu) { return el('div', { class: 'carte', style: 'margin-bottom:14px' }, titre ? el('h3', {}, titre) : null, ...contenu); }
function champ(id, etiquette, attrs) {
  const { liste, ...autres } = attrs || {};
  return el('div', {}, el('label', { for: id }, etiquette), el(liste ? 'select' : 'input', Object.assign({ id }, autres),
    ...(liste ? liste.map(([v, t]) => el('option', { value: v }, t)) : [])));
}
const val = (id) => document.getElementById(id).value.trim();

/** Envoie une action au serveur et attend son résultat (le plugin la fait dans la seconde). */
async function action(a, zoneMsg) {
  const r = await api('mod/action', { session: S(), action: a });
  if (r.erreur) { message(zoneMsg, r.erreur); return null; }
  message(zoneMsg, 'Envoyé au serveur…', true);
  for (let i = 0; i < 20; i++) {
    await new Promise((ok) => setTimeout(ok, 700));
    const x = await api('mod/resultat', { session: S(), id: r.id });
    if (x.message !== undefined) { message(zoneMsg, x.message, x.ok); return x; }
  }
  message(zoneMsg, 'Pas de réponse du serveur pour le moment (l\'action sera faite dès qu\'il répond).');
  return null;
}
function confirmer(texte) { return window.confirm(texte); }

// ---------- Sections ----------
const VUES = {
  async tableau(z) {
    const e = await api('mod/etat', { session: S() });
    if (e.erreur) return z.replaceChildren(carte(null, e.erreur));
    const msg = el('div', { class: 'message' });
    z.replaceChildren(
      carte('Serveur', el('div', { class: 'infos' },
        el('div', { class: 'info' }, el('span', {}, 'État'), el('strong', {}, e.connecte ? '🟢 En ligne' : '🔴 Injoignable')),
        el('div', { class: 'info' }, el('span', {}, 'Joueurs'), el('strong', {}, e.enLigne.length + ' / ' + e.max)),
        el('div', { class: 'info' }, el('span', {}, 'TPS'), el('strong', {}, e.tps >= 0 ? e.tps : '—')),
        el('div', { class: 'info' }, el('span', {}, 'Comptes du site'), el('strong', {}, e.comptes)),
        el('div', { class: 'info' }, el('span', {}, 'Inscriptions'), el('strong', {}, e.inscriptions ? 'Ouvertes' : 'Fermées')))),
      carte('Joueurs connectés', msg, e.enLigne.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Joueur', 'Grade', 'Faction', 'Position', 'Vie', 'Ping', ''].map((t) => el('th', {}, t)))),
        el('tbody', {}, e.enLigne.map((j) => el('tr', {},
          el('td', {}, teteMini(j.pseudo), j.pseudo, j.op ? ' ⭐' : ''), el('td', {}, j.grade), el('td', {}, j.faction || '—'),
          el('td', {}, `${j.monde} ${j.x} ${j.y} ${j.z}`), el('td', {}, j.vie + ' ❤'), el('td', {}, j.ping + ' ms'),
          el('td', {}, el('div', { class: 'boutons-petits' },
            el('button', { onclick: () => ouvrirJoueur(j.pseudo) }, 'Fiche'),
            el('button', { onclick: async () => { const r = prompt('Raison de l\'expulsion ?'); if (r !== null) action({ type: 'sanction', sanction: 'kick', pseudo: j.pseudo, raison: r }, msg); } }, 'Kick')))))))
        : el('p', { class: 'vide' }, 'Personne en ligne.')));
  },

  async joueurs(z, pseudo) {
    const recherche = el('input', { placeholder: 'Rechercher un joueur…', value: pseudo || '' });
    const liste = el('div', { class: 'boutons-petits', style: 'margin-top:10px' });
    const fiche = el('div');
    const chercher = async () => {
      const r = await api('mod/joueurs', { session: S(), recherche: recherche.value });
      liste.replaceChildren(...(r.joueurs || []).map((j) => el('button', { onclick: () => montrerFiche(j.pseudo) },
        (j.enLigne ? '🟢 ' : '') + j.pseudo + (j.sanctions ? ` (${j.sanctions})` : ''))));
    };
    async function montrerFiche(p) {
      const f = await api('mod/joueur', { session: S(), pseudo: p });
      if (f.erreur) return fiche.replaceChildren(carte(null, f.erreur));
      const msg = el('div', { class: 'message' });
      const c = f.compte, j = c && c.jeu, l = f.enLigne;
      fiche.replaceChildren(
        carte(null, el('div', { class: 'profil' }, teteMini(f.pseudo, 64), el('div', {}, el('strong', {}, f.pseudo),
          el('div', { class: 'aide' }, l ? `🟢 En ligne · ${l.monde} ${l.x} ${l.y} ${l.z} · ${l.vie} ❤ · ${l.ping} ms · ${l.mode}` : '⚫ Hors ligne'))),
          el('div', { class: 'infos' },
            el('div', { class: 'info' }, el('span', {}, 'Compte du site'), el('strong', {}, c ? 'Oui (' + c.role + ')' : 'Non')),
            el('div', { class: 'info' }, el('span', {}, 'Grade'), el('strong', {}, (l && l.grade) || (j && j.grade) || '—')),
            el('div', { class: 'info' }, el('span', {}, 'Argent'), el('strong', {}, l ? nombre(l.argent) : j ? nombre(j.argent) : '—')),
            el('div', { class: 'info' }, el('span', {}, 'Faction'), el('strong', {}, (l && l.faction) || (j && j.faction) || '—')),
            el('div', { class: 'info' }, el('span', {}, 'Kills · Morts'), el('strong', {}, j ? j.kills + ' · ' + j.morts : '—')),
            el('div', { class: 'info' }, el('span', {}, 'Dernière partie'), el('strong', {}, c ? dateHeure(c.derniereConnexion) : '—')),
            el('div', { class: 'info' }, el('span', {}, 'Créé le'), el('strong', {}, c ? dateHeure(c.cree) : '—')),
            el('div', { class: 'info' }, el('span', {}, 'E-mail'), el('strong', {}, (c && c.email) || '—')))),
        carte('Sanctionner', el('div', { class: 'ligne-form' },
          champ('s-type', 'Sanction', { liste: [['warn', 'Avertissement'], ['mute', 'Mute'], ['kick', 'Expulsion'], ['ban', 'Bannissement']] }),
          champ('s-duree', 'Durée (vide = définitif)', { placeholder: '30m, 2h, 7j, 2sem' }),
          champ('s-raison', 'Raison', { placeholder: 'Raison visible par le joueur' }),
          el('button', { class: 'bouton', onclick: async () => {
            const t = val('s-type');
            if (!val('s-raison')) return message(msg, 'Donne une raison.');
            if (t === 'ban' && !confirmer(`Bannir ${f.pseudo} ${val('s-duree') ? 'pour ' + val('s-duree') : 'définitivement'} ?`)) return;
            await action({ type: 'sanction', sanction: t, pseudo: f.pseudo, duree: t === 'ban' || t === 'mute' ? val('s-duree') : '', raison: val('s-raison') }, msg);
            setTimeout(() => montrerFiche(f.pseudo), 2500);
          } }, 'Appliquer')),
          el('div', { class: 'boutons-petits', style: 'margin-top:10px' },
            el('button', { onclick: async () => { await action({ type: 'lever', sanction: 'mute', pseudo: f.pseudo }, msg); setTimeout(() => montrerFiche(f.pseudo), 2500); } }, 'Lever le mute'),
            el('button', { onclick: async () => { await action({ type: 'lever', sanction: 'ban', pseudo: f.pseudo }, msg); setTimeout(() => montrerFiche(f.pseudo), 2500); } }, 'Lever le bannissement')),
          el('p', { class: 'aide' }, 'Modérateur : bannissement jusqu\'à 7 jours. Administrateur et Créateur : sans limite.'), msg),
        carte(`Casier (${f.casier.length})`, f.casier.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Date', 'Sanction', 'Raison', 'Par', 'Fin'].map((t) => el('th', {}, t)))),
          el('tbody', {}, f.casier.map((s) => el('tr', {}, el('td', {}, dateHeure(s.debut)),
            el('td', {}, el('span', { class: 'etiquette ' + s.type }, NOMS_SANCTIONS[s.type] || s.type), s.leve ? el('span', { class: 'etiquette ok', style: 'margin-left:6px' }, 'levé') : null),
            el('td', {}, s.raison), el('td', {}, s.par),
            el('td', {}, s.type === 'ban' || s.type === 'mute' ? (s.fin > 0 ? dateHeure(s.fin) : 'Définitif') : '—'))))) : el('p', { class: 'vide' }, 'Casier vierge.')));
    }
    recherche.addEventListener('input', chercher);
    z.replaceChildren(carte('Rechercher', recherche, liste), fiche);
    await chercher();
    if (pseudo) montrerFiche(pseudo);
  },

  async console(z) {
    const boite = el('div', { class: 'console' });
    const entree = el('input', { placeholder: moi.niveau >= 3 ? 'Commande (sans /) puis Entrée…' : 'Seul le Créateur peut taper des commandes', disabled: moi.niveau < 3 });
    const msg = el('div', { class: 'message' });
    entree.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !entree.value.trim()) return;
      const c = entree.value.trim();
      entree.value = '';
      await action({ type: 'commande', commande: c }, msg);
    });
    z.replaceChildren(carte('Console du serveur', boite, el('div', { style: 'margin-top:10px' }, entree), msg));
    seqConsole = 0;
    const lire = async () => {
      const r = await api('mod/console', { session: S(), depuis: seqConsole });
      if (r.erreur) return;
      const enBas = boite.scrollTop + boite.clientHeight >= boite.scrollHeight - 30;
      for (const l of r.lignes) boite.append(el('div', { class: /WARN/.test(l) ? 'warn' : /ERROR|FATAL/.test(l) ? 'err' : '' }, l));
      while (boite.childNodes.length > 2000) boite.firstChild.remove();
      seqConsole = r.seq;
      if (enBas) boite.scrollTop = boite.scrollHeight;
    };
    await lire();
    boite.scrollTop = boite.scrollHeight;
    minuterie = setInterval(lire, 1500);
  },

  async evenements(z) {
    const msg = el('div', { class: 'message' });
    const evts = [['boss', '👹 Boss du Gouffre'], ['koth', '⛰ KOTH'], ['largage', '📦 Largage'], ['tornade', '🌪 Tornade'], ['meteorites', '☄ Météorites'],
      ['eruption', '🌋 Éruption'], ['seisme', '🌍 Séisme'], ['grele', '🧊 Grêle'], ['tempete', '⛈ Tempête'], ['lunedesang', '🌕 Lune de sang']];
    z.replaceChildren(
      carte('Annonce à tout le serveur', el('div', { class: 'ligne-form' }, champ('a-texte', 'Message', { placeholder: 'Texte de l\'annonce (titre à l\'écran + chat)' }),
        el('button', { class: 'bouton', onclick: () => val('a-texte') && action({ type: 'annonce', texte: val('a-texte') }, msg) }, 'Annoncer'))),
      carte('Lancer un événement', el('div', { class: 'boutons-petits' }, evts.map(([n, t]) => el('button', { onclick: () => confirmer('Lancer : ' + t + ' ?') && action({ type: 'evenement', nom: n }, msg) }, t))),
        el('div', { class: 'boutons-petits', style: 'margin-top:10px' },
          el('button', { class: 'danger', onclick: () => action({ type: 'evenement', nom: 'arreter' }, msg) }, '⏹ Arrêter l\'événement en cours'),
          el('button', { class: 'danger', onclick: () => action({ type: 'evenement', nom: 'retirerboss' }, msg) }, '✖ Retirer le Boss'))),
      msg);
  },

  async factions(z) {
    const r = await api('mod/factions', { session: S() });
    if (r.erreur) return z.replaceChildren(carte(null, r.erreur));
    const msg = el('div', { class: 'message' });
    const recharger = () => setTimeout(() => VUES.factions(z), 2500);
    z.replaceChildren(msg, carte(`Factions (${r.factions.length})`, r.factions.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Nom', 'Chef', 'Membres', 'Puissance', 'Territoires', 'Banque', ''].map((t) => el('th', {}, t)))),
      el('tbody', {}, r.factions.map((f) => el('tr', {}, el('td', {}, el('strong', {}, f.nom)), el('td', {}, f.chef), el('td', { title: f.membres.join(', ') }, f.membres.length),
        el('td', {}, nombre(f.puissance)), el('td', {}, f.territoires), el('td', {}, nombre(f.banque)),
        el('td', {}, el('div', { class: 'boutons-petits' },
          el('button', { onclick: async () => { const n = prompt('Nouveau nom de ' + f.nom + ' ?'); if (n) { await action({ type: 'faction', action: 'renommer', id: f.id, valeur: n }, msg); recharger(); } } }, 'Renommer'),
          el('button', { onclick: async () => { const n = prompt('Expulser quel membre ?\n' + f.membres.join(', ')); if (n) { await action({ type: 'faction', action: 'expulser', id: f.id, valeur: n }, msg); recharger(); } } }, 'Expulser'),
          el('button', { onclick: async () => { const n = prompt('Nouveau montant de la banque ?', f.banque); if (n !== null) { await action({ type: 'faction', action: 'banque', id: f.id, valeur: n }, msg); recharger(); } } }, 'Banque'),
          el('button', { class: 'danger', onclick: async () => { if (confirmer('Dissoudre ' + f.nom + ' ? (territoires, home et relations effacés)')) { await action({ type: 'faction', action: 'dissoudre', id: f.id }, msg); recharger(); } } }, 'Dissoudre')))))))
      : el('p', { class: 'vide' }, 'Aucune faction.')), el('p', { class: 'aide' }, r.maj ? 'Liste mise à jour le ' + dateHeure(r.maj) + ' (toutes les minutes).' : ''));
  },

  async economie(z) {
    const msg = el('div', { class: 'message' });
    z.replaceChildren(
      carte('Argent d\'un joueur', el('div', { class: 'ligne-form' }, champ('e-pseudo', 'Joueur'),
        champ('e-mode', 'Opération', { liste: [['donner', 'Donner'], ['retirer', 'Retirer'], ['definir', 'Définir à']] }),
        champ('e-montant', 'Montant', { type: 'number', min: 0 }),
        el('button', { class: 'bouton', onclick: () => action({ type: 'argent', pseudo: val('e-pseudo'), mode: val('e-mode'), montant: val('e-montant') }, msg) }, 'Valider'))),
      carte('Cadeau à tous les joueurs connectés (giveall)', el('div', { class: 'ligne-form' },
        champ('g-objet', 'Objet', { placeholder: 'diamond, golden_apple, onyxfight:cle_rare…' }), champ('g-qte', 'Quantité', { type: 'number', min: 1, value: 1 }),
        el('button', { class: 'bouton', onclick: () => confirmer('Donner ' + val('g-qte') + ' × ' + val('g-objet') + ' à tous les joueurs connectés ?') && action({ type: 'giveall', objet: val('g-objet'), quantite: val('g-qte') }, msg) }, 'Donner à tous'))),
      msg);
  },

  async equipe(z) {
    const msg = el('div', { class: 'message' });
    const dessiner = (r) => z.replaceChildren(carte('Équipe', r.equipe.length ? el('table', {}, el('tbody', {}, r.equipe.map((m) => el('tr', {},
      el('td', {}, teteMini(m.pseudo), m.pseudo), el('td', {}, m.nomRole),
      el('td', {}, el('div', { class: 'boutons-petits' }, el('button', { class: 'danger', onclick: async () => { if (confirmer('Retirer ' + m.pseudo + ' de l\'équipe ?')) charger({ pseudo: m.pseudo, role: 'joueur' }); } }, 'Retirer'))))))) : null,
      el('div', { class: 'ligne-form' }, champ('r-pseudo', 'Pseudo (compte du site)'),
        champ('r-role', 'Rôle', { liste: [['moderateur', 'Modérateur : sanctions, casier'], ['admin', 'Administrateur : + console, événements, factions'], ['createur', 'Créateur : tout']] }),
        el('button', { class: 'bouton', onclick: () => charger({ pseudo: val('r-pseudo'), role: val('r-role') }) }, 'Donner le rôle')), msg));
    const charger = async (x) => {
      const r = await api('mod/roles', Object.assign({ session: S() }, x || {}));
      if (r.erreur) return message(msg, r.erreur);
      dessiner(r);
      if (x) message(msg, 'Rôle mis à jour.', true);
    };
    charger();
  },

  async journal(z) {
    const r = await api('mod/journal', { session: S() });
    if (r.erreur) return z.replaceChildren(carte(null, r.erreur));
    z.replaceChildren(carte('Journal de l\'équipe (300 dernières actions)', r.journal.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Date', 'Qui', 'Action', 'Détails'].map((t) => el('th', {}, t)))),
      el('tbody', {}, r.journal.map((j) => el('tr', {}, el('td', {}, dateHeure(j.t)), el('td', {}, j.par), el('td', {}, j.action), el('td', { style: 'font-size:12px;color:var(--gris)' }, j.details)))))
      : el('p', { class: 'vide' }, 'Rien pour le moment.')));
  },

  async reglages(z) {
    const msg = el('div', { class: 'message' });
    const r = await api('mod/config', { session: S() });
    if (r.erreur) return z.replaceChildren(carte(null, r.erreur));
    const votes = el('textarea', { id: 'c-votes', rows: 4, style: 'width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,.35);color:var(--texte);border:1px solid var(--bord);font:inherit' });
    votes.value = r.votes.map((v) => v.nom + ' | ' + v.url).join('\n');
    z.replaceChildren(
      carte('Boutique Tebex', champ('c-tebex', 'Clé publique de la boutique (Tebex → Integrations → Headless API → « Public token »)', { value: r.tebex }),
        el('p', { class: 'aide' }, 'La livraison en jeu utilise la clé secrète du serveur (tebex.secret dans la config du plugin).')),
      carte('Sites de vote', el('label', {}, 'Un site par ligne : Nom | https://adresse-de-vote'), votes),
      carte('Inscriptions', el('p', {}, r.inscriptions ? 'Les inscriptions sont ouvertes.' : 'Les inscriptions sont fermées.'),
        el('button', { class: 'bouton secondaire', onclick: async () => { const x = await api('mod/inscriptions', { session: S(), ouvrir: !r.inscriptions }); if (!x.erreur) VUES.reglages(z); } },
          r.inscriptions ? 'Fermer les inscriptions' : 'Ouvrir les inscriptions')),
      el('button', { class: 'bouton', onclick: async () => {
        const v = votes.value.split('\n').map((l) => l.split('|').map((x) => x.trim())).filter((x) => x.length === 2).map(([nom, url]) => ({ nom, url }));
        const x = await api('mod/config', { session: S(), config: { tebex: val('c-tebex'), votes: v } });
        message(msg, x.erreur || 'Réglages enregistrés.', !x.erreur);
      } }, 'Enregistrer'), msg);
  },
};

function ouvrirJoueur(p) { ouvrir('joueurs', p); }
function ouvrir(id, arg) {
  ongletActif = id;
  if (minuterie) { clearInterval(minuterie); minuterie = null; }
  document.querySelectorAll('#cote button').forEach((b) => b.classList.toggle('actif', b.dataset.id === id));
  const z = $('zone');
  z.replaceChildren(el('p', { class: 'vide' }, 'Chargement…'));
  VUES[id](z, arg);
  if (id === 'tableau') minuterie = setInterval(() => ongletActif === 'tableau' && VUES.tableau(z), 10000);
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!S()) return (location.href = '/compte');
  moi = await api('mod/moi', { session: S() });
  if (moi.erreur || !moi.niveau) {
    $('qui').textContent = moi.erreur || 'Cette partie est réservée à l\'équipe.';
    return;
  }
  $('qui').textContent = `Connecté en tant que ${moi.pseudo} · ${moi.nomRole}`;
  $('cote').replaceChildren(...SECTIONS.map(([id, t, min]) => el('button', { 'data-id': id, disabled: moi.niveau < min, onclick: () => ouvrir(id) }, t)));
  $('panneau').classList.remove('cache');
  ouvrir('tableau');
});
</script>
<footer>OnyxFight · serveur PvP Faction moddé · Pas affilié à Mojang ni Microsoft.</footer>
</body>
</html>
